name: Schedule Nightly Bundled Desktop Release

# GitHub evaluates cron only on the default branch. Keep this scheduler on
# main and merge it back into staging; the actual release runs on staging.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: desktop-nightly-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    name: Queue bundled nightly from staging
    runs-on: ubuntu-22.04
    steps:
      - name: Skip scheduled nightly after a recent desktop release
        id: recent-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('build', 'true');
            if (context.eventName !== 'schedule') return;

            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            // Use the original daily cron slot, even after queue delays or reruns.
            const cron = /^(\d+) (\d+) \* \* \*$/.exec(context.payload.schedule);
            if (!cron) throw new Error('Expected a daily UTC cron schedule');
            const createdAt = new Date(run.created_at);
            const scheduledAt = new Date(createdAt);
            scheduledAt.setUTCHours(Number(cron[2]), Number(cron[1]), 0, 0);
            if (scheduledAt > createdAt) scheduledAt.setUTCDate(scheduledAt.getUTCDate() - 1);
            const cutoff = scheduledAt.getTime() - 9 * 60 * 60 * 1000;

            for await (const { data: releases } of github.paginate.iterator(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            })) {
              const recent = releases.find(release => !release.draft &&
                release.tag_name.startsWith('desktop-v') && Date.parse(release.published_at) >= cutoff);
              if (!recent) continue;
              core.setOutput('build', 'false');
              await core.summary.addRaw(`Skipping scheduled desktop nightly: [${recent.tag_name}](${recent.html_url}) was published at ${recent.published_at}, within the release window starting nine hours before ${scheduledAt.toISOString()}.`).write();
              return;
            }
            await core.summary.addRaw(`No desktop release published since ${new Date(cutoff).toISOString()}; queueing the scheduled nightly.`).write();

      # Build Desktop already exists on main, so GitHub can discover its
      # workflow_dispatch entry point while loading its implementation from staging.
      - name: Dispatch bundled release workflow on staging
        if: steps.recent-release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run desktop-build.yml --ref staging --field bundled_nightly=true
