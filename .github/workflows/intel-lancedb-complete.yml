name: Complete Private Intel LanceDB Dependency

on:
  workflow_dispatch:
    inputs:
      builder_run:
        required: true
        type: string
      builder_attempt:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: intel-lancedb-publication
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate the completed private build and original source workflow
        id: build
        env:
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          BUILDER_RUN_ID: ${{ inputs.builder_run }}
          BUILDER_RUN_ATTEMPT: ${{ inputs.builder_attempt }}
        run: bun --no-env-file scripts/intel-lancedb-bridge.ts resolve
      - name: Download the native-verified dependency
        uses: actions/download-artifact@v7
        with:
          repository: prolix-oc/Lumiverse-Builds
          run-id: ${{ inputs.builder_run }}
          name: ${{ steps.build.outputs.artifact }}
          github-token: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          path: native-artifact
      - name: Check out the exact trusted source and its build policy
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.build.outputs.source }}
          path: source
          persist-credentials: false
      - name: Verify the handoff and publish without replacing existing binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.build.outputs.source }}
          BUILDER_RUN_ID: ${{ inputs.builder_run }}
        run: >-
          bun --no-env-file -e 'import {publishIntelLanceDb} from "./source/scripts/lancedb-macos-release.ts";
          import {ReleaseAPI} from "./source/scripts/desktop-release.ts";
          await publishIntelLanceDb(new ReleaseAPI("prolix-oc/Lumiverse",process.env.GITHUB_TOKEN),
          "native-artifact",process.env.SOURCE_SHA,
          `Native checks ran in private build ${process.env.BUILDER_RUN_ID}.`);'
