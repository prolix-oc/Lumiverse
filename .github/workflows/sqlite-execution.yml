name: SQLite execution regression tests

on:
  pull_request:
    paths:
      - 'src/auth/**'
      - 'src/db/**'
      - 'src/utils/bun-cmd.ts'
      - 'src/utils/subprocess-messages.ts'
      - 'src/runtime/bun-runtime.ts'
      - 'src/services/**'
      - 'src/routes/**'
      - 'src/app.ts'
      - 'src/main.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/sqlite-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - name: Test contention, responsiveness, interruption, and cleanup
        run: >-
          bun test --isolate
          src/auth/startup.test.ts
          src/db/connection.test.ts
          src/db/execution.test.ts
          src/db/execution-transport.test.ts
          src/db/checkpoint-diagnostics.test.ts
          src/db/image-reference-index.test.ts
          src/db/migrate.baseline-sync.test.ts
          src/db/migrate.test.ts
          src/db/maintenance.test.ts
          src/db/maintenance-scheduler.test.ts
          src/services/database-execution.test.ts
          src/services/async-database-callers.test.ts
          src/services/tokenizer-seed.test.ts
          src/services/tokenizer-seed.database-execution.test.ts
          src/services/settings.service.test.ts
          src/services/presets.service.test.ts
          src/services/regex-scripts.service.test.ts
          src/services/preset-export.service.test.ts
          src/routes/personas.routes.test.ts
          src/routes/presets.routes.test.ts
          src/routes/characters-batch-delete.routes.test.ts
          src/routes/deletion-status.routes.test.ts
          src/routes/character-gallery.routes.test.ts
          src/services/characters-bulk-tags.test.ts
          src/services/world-books-delete.test.ts
          src/services/user-data/export-locks.test.ts
