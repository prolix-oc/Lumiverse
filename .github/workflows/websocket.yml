name: WebSocket streaming regression tests

on:
  pull_request:
    paths:
      - 'src/ws/**'
      - 'src/app.ts'
      - 'src/main.ts'
      - 'src/runtime/bun-runtime.ts'
      - 'scripts/runner/**'
      - 'scripts/install-bun-runtime.ps1'
      - 'start.sh'
      - 'start.ps1'
      - 'tests/bun-runtime-version-policy.test.ts'
      - 'src/services/generate.service.ts'
      - 'src/services/generation/**'
      - 'src/multiplayer/**'
      - 'src/services/multiplayer.service.ts'
      - 'tests/multiplayer-ws.test.ts'
      - 'frontend/src/ws/**'
      - 'frontend/src/lib/generation-recovery*'
      - 'frontend/src/store/slices/chat*'
      - 'package.json'
      - 'bun.lock'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/workflows/websocket.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Typecheck backend
        run: bun x tsc --noEmit
      - name: Test runtime floor, receive queues, streaming and room isolation
        run: bun --no-env-file test --isolate tests/bun-runtime-version-policy.test.ts src/ws/receive-queue.test.ts src/ws/transport.test.ts src/ws/handler.frontend-session.test.ts tests/multiplayer-ws.test.ts
      - name: Test browser reconnect and generation recovery
        working-directory: frontend
        run: bun --no-env-file test --isolate src/ws/client.test.ts src/lib/generation-recovery.test.ts
