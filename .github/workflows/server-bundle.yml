name: Build Bundled Desktop Release

# One pipeline for both channels; builds a complete desktop/server distribution.
# Windows compilation and nightly Linux compilation run in the private builder
# repository. Hosted completion signs their payloads and joins the release gate.
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      channel:
        type: string
        required: true
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      fingerprint:
        type: string
        required: true
    secrets:
      LINUX_RELEASE_BRIDGE_TOKEN:
        required: false
      LUMIVERSE_UPDATER_PUBLIC_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read
concurrency:
  group: bundled-desktop-${{ inputs.channel }}
  cancel-in-progress: false
env:
  DESKTOP_CHANNEL: ${{ inputs.channel }}
  DESKTOP_VERSION: ${{ inputs.version }}
  DESKTOP_TAG: ${{ inputs.tag }}
  DESKTOP_SHA: ${{ inputs.source }}
  DESKTOP_SOURCE: ${{ inputs.fingerprint }}

jobs:
  prepare:
    name: Prepare unpublished signed release
    runs-on: ubuntu-22.04
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Choose hosted platforms for the release channel
        id: platforms
        run: bun scripts/private-linux-release.ts matrix
      - name: Require updater signing configuration
        env:
          LUMIVERSE_UPDATER_PUBLIC_KEY: ${{ vars.LUMIVERSE_UPDATER_PUBLIC_KEY || secrets.LUMIVERSE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun -e 'if (!process.env.LUMIVERSE_UPDATER_PUBLIC_KEY?.trim() || !process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) throw new Error("Configure LUMIVERSE_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before publishing signed updates.")'
      - name: Create or reuse matching draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/publish-desktop-release.ts create
      - name: Record immutable private build request
        env:
          LUMIVERSE_UPDATER_PUBLIC_KEY: ${{ vars.LUMIVERSE_UPDATER_PUBLIC_KEY || secrets.LUMIVERSE_UPDATER_PUBLIC_KEY }}
        run: bun scripts/private-linux-release.ts request
      - name: Retain request for the private builder and release verifier
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-request-${{ github.run_attempt }}
          path: request.json
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Queue private Linux x64 and ARM64 builders
    needs: prepare
    if: inputs.channel == 'nightly'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Dispatch without occupying a hosted runner during compilation
        env:
          PRIVATE_BUILDER: linux
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
        run: bun scripts/private-linux-release.ts dispatch

  windows:
    name: Queue private Windows x64 and ARM64 builder
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Dispatch without waiting for Windows compilation
        env:
          PRIVATE_BUILDER: windows
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
        run: bun scripts/private-linux-release.ts dispatch

  macos:
    name: Queue private Intel macOS builder
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Dispatch without waiting for Intel macOS compilation
        env:
          PRIVATE_BUILDER: macos
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
        run: bun scripts/private-linux-release.ts dispatch

  build:
    name: Bundled desktop (${{ matrix.platform }})
    needs: prepare
    timeout-minutes: ${{ matrix.platform == 'darwin-x86_64' && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils squashfs-tools dbus-x11 xauth xvfb xdotool gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Install build dependencies
        run: bun install --frozen-lockfile
      - name: Install frontend build dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install desktop build dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Test launcher, release policy, and desktop lifecycle
        run: bun test tests/server-bundle.test.ts tests/lancedb-macos-native.test.ts scripts/lancedb-macos-release.test.ts tests/bun-runtime-version-policy.test.ts scripts/desktop-toolchain.test.ts scripts/private-linux-release.test.ts scripts/desktop-release.test.ts desktop/src-tauri/permissions.test.ts desktop/tests/desktop-updates.test.ts desktop/tests/instance-connection.test.ts desktop/tests/custom-url-ui.test.ts desktop/tests/local-server.test.ts desktop/tests/runner-client.test.ts scripts/desktop-session-restoration.test.ts scripts/tauri-finalized.test.ts scripts/appimage-packaging.test.ts scripts/appimage-runtime-manifest.test.ts desktop/tests/linux-desktop.test.ts src/spindle/runtime-transport.test.ts src/db/execution-transport.test.ts
      - name: Test nightly release notifications
        run: bun --no-env-file test scripts/notify-nightly-release.test.ts
      - name: Test production browser cookie transport
        run: bun --no-env-file test src/auth/request-cookies.integration.test.ts
        env:
          NODE_ENV: production
      - name: Test updater signature verifier
        run: cargo test --locked --manifest-path desktop/tools/verify-updater/Cargo.toml --target ${{ matrix.target }}
      - name: Typecheck backend and packaging
        shell: bash
        run: |
          bun x tsc --noEmit
          bun x tsc --project scripts/tsconfig.server-bundle.json --noEmit
      - name: Download the versioned Intel LanceDB dependency
        if: matrix.platform == 'darwin-x86_64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun --no-env-file scripts/lancedb-macos-release.ts download
      - name: Verify the downloaded Intel LanceDB checksum and native operations
        if: matrix.platform == 'darwin-x86_64'
        run: bun --no-env-file scripts/check-lancedb-macos.ts --artifact-dir dist/native/lancedb-darwin-x64
      - name: Build standalone server and test outside the checkout
        shell: bash
        run: |
          bun run build:server
          bun run test:server-bundle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop-registry-${{ matrix.target }}
          cache-targets: false
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test native Linux desktop policies and authorization
        if: runner.os == 'Linux'
        run: |
          bun run --cwd desktop build
          cargo test --locked --lib --manifest-path desktop/src-tauri/Cargo.toml
      - name: Stamp the actual release version in the CI checkout
        run: bun run desktop:version "$env:DESKTOP_VERSION"
        if: runner.os == 'Windows'
      - name: Stamp the actual release version in the CI checkout
        run: bun run desktop:version "$DESKTOP_VERSION"
        if: runner.os != 'Windows'
      - name: Stage the tested server and enable signed update artifacts
        env:
          LUMIVERSE_UPDATER_PUBLIC_KEY: ${{ vars.LUMIVERSE_UPDATER_PUBLIC_KEY || secrets.LUMIVERSE_UPDATER_PUBLIC_KEY }}
        run: |
          bun run build:desktop-server --reuse-server --stage-only
          bun -e 'await Bun.write("desktop/src-tauri/tauri.release-updater.conf.json", JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.LUMIVERSE_UPDATER_PUBLIC_KEY?.trim()}}}))'
      - name: Build self-contained signed desktop release
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          LUMIVERSE_UPDATER_PUBLIC_KEY: ${{ vars.LUMIVERSE_UPDATER_PUBLIC_KEY || secrets.LUMIVERSE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bun run tauri:finalized build --verbose --config src-tauri/tauri.server-bundle.conf.json --config src-tauri/tauri.release-updater.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
      - name: Verify finalized updater signatures against the embedded public key
        env:
          LUMIVERSE_UPDATER_PUBLIC_KEY: ${{ vars.LUMIVERSE_UPDATER_PUBLIC_KEY || secrets.LUMIVERSE_UPDATER_PUBLIC_KEY }}
        run: cargo run --locked --release --manifest-path desktop/tools/verify-updater/Cargo.toml --target ${{ matrix.target }} -- desktop/src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Retain Linux runtime provenance
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-runtime-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppDir/usr/share/lumiverse/runtime-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test finalized Linux AppImage offline as another user
        if: runner.os == 'Linux'
        run: bash scripts/smoke-test-appimage.sh desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage
      - name: Upload tested signed platform assets to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_PLATFORM: ${{ matrix.platform }}
          DESKTOP_TARGET: ${{ matrix.target }}
        run: bun scripts/publish-desktop-release.ts upload

  publish:
    name: Hand off release publication
    needs: [build, linux, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Leave publication to the asynchronous completion gate on main
        run: echo 'The completion workflow joins the required private builders with these hosted platform results before publishing all six platforms.'
