name: Build Desktop

# Builds installers as downloadable workflow artifacts whenever the desktop
# manifests or tray-runner integration changes on a feature branch. Bundled
# stable/nightly releases use the separate desktop release workflows.
on:
  push:
    branches-ignore: [main, staging]
    paths:
      - ".github/workflows/desktop-build.yml"
      - "desktop/src/**"
      - "desktop/tests/**"
      - "desktop/vite.config.ts"
      - "desktop/*.html"
      - "desktop/src-tauri/src/**"
      - "desktop/linux-runtime-policy.json"
      - "scripts/appimage-*"
      - "desktop/src-tauri/capabilities/*.json"
      - "desktop/src-tauri/permissions/*.toml"
      - "desktop/package.json"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/Cargo.lock"
      - "desktop/src-tauri/tauri.conf.json"
      - "desktop/src-tauri/capabilities/system-audio.json"
      - "desktop/src-tauri/permissions/system-audio.toml"
      - "desktop/src-tauri/capabilities/desktop-capture.json"
      - "desktop/src-tauri/permissions/desktop-capture.toml"
      - "desktop/src-tauri/permissions.test.ts"
      - "desktop/src-tauri/build.rs"
      - "scripts/finalize-appimage.sh"
      - "scripts/verify-appimage-permissions.sh"
      - "scripts/appimage-packaging.test.ts"
      - "scripts/smoke-test-appimage.sh"
      - "scripts/tauri-finalized.ts"
      - "scripts/tauri-finalized.test.ts"
      - "scripts/verify-appimage-gstreamer.sh"
      - "scripts/runner.ts"
      - "scripts/runner/**"
      - "scripts/windows-msvc.ts"
      - "scripts/windows-msvc.test.ts"
      - "src/main.ts"
      - "src/services/operator.service.ts"
      - "src/services/runner-channel.ts"
      - "src/services/runner-control-transport.ts"
      - "src/services/runner-control-transport.test.ts"
      - "src/types/operator.ts"
  workflow_dispatch:
    inputs:
      bundled_nightly:
        description: Build and publish the bundled nightly from staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate desktop manifests
    if: ${{ !inputs.bundled_nightly }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify versions and Cargo.lock
        run: |
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path desktop/src-tauri/Cargo.toml \
            | jq -r '.packages[] | select(.name == "lumiverse-tray") | .version')"
          package_version="$(jq -r .version desktop/package.json)"
          tauri_version="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          if [[ "$cargo_version" != "$package_version" || "$cargo_version" != "$tauri_version" ]]; then
            echo "::error::Desktop versions differ: Cargo.toml=$cargo_version, package.json=$package_version, tauri.conf.json=$tauri_version"
            exit 1
          fi

  nightly:
    name: Test bundled nightly from staging
    if: github.event_name == 'workflow_dispatch' && inputs.bundled_nightly
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/desktop-nightly.yml
    secrets: inherit

  build:
    name: Desktop (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          # AppImage cannot be cross-compiled, so build Linux ARM64 natively.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          # ARM64 Windows: NSIS only — WiX/MSI has no ARM64 support.
          # Cross-compiled on the x64 runner, the documented approach.
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Test Windows tray runner and MSVC setup
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: >-
          bun test
          src/services/runner-control-transport.test.ts
          scripts/runner/server-manager.test.ts
          scripts/windows-msvc.test.ts
          scripts/tauri-finalized.test.ts
          desktop/src-tauri/permissions.test.ts

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}
          cache-targets: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils \
            dbus-x11 xauth xvfb xdotool gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good squashfs-tools

      - name: Test Linux AppImage packaging
        if: runner.os == 'Linux'
        run: bun --no-env-file test scripts/appimage-packaging.test.ts scripts/appimage-runtime-manifest.test.ts scripts/tauri-finalized.test.ts desktop/tests/linux-desktop.test.ts

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Test shared native surface policy
        run: >-
          cargo test --locked --lib --manifest-path desktop/src-tauri/Cargo.toml desktop_surface::

      - name: Test Windows native capture and WebView lifecycle
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: desktop
        run: |
          bun run build
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml capture::
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml system_audio::
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml webview_visibility::

      - name: Test Linux system audio boundaries
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: desktop
        run: |
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml system_audio::

      - name: Test macOS system audio boundaries
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          bun test tests/system-audio-coreaudio.test.ts ../scripts/tauri-finalized.test.ts
          bun run build
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml system_audio::

      - name: Build desktop installers
        uses: tauri-apps/tauri-action@v1
        env:
          # Ad-hoc signing needs no Apple certificate, but is NOT notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # Let AppImage packaging run without a FUSE mount in hosted CI.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          projectPath: desktop
          # Finalize Linux AppImages before tauri-action uploads the artifacts.
          tauriScript: bun run tauri:finalized
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: false

      - name: Test native Linux desktop policies and authorization
        if: runner.os == 'Linux'
        run: cargo test --locked --lib --manifest-path desktop/src-tauri/Cargo.toml

      - name: Retain Linux runtime provenance
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-runtime-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppDir/usr/share/lumiverse/runtime-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test Linux AppImage offline as another user
        if: runner.os == 'Linux'
        run: >-
          bash scripts/smoke-test-appimage.sh
          desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage

      - name: Retain feature-branch installers briefly
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
