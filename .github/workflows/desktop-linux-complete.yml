name: Complete Private Desktop Release

on:
  workflow_run:
    workflows: [Build Desktop, Nightly Bundled Desktop Release, Stable Bundled Desktop Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Original public desktop release workflow run
        required: true
        type: string
      source_attempt:
        description: Original workflow run attempt
        required: true
        type: string

permissions:
  contents: write
  actions: read

# Serialize signing/publication from both completion events. The publication
# policy independently refuses incomplete, mismatched or older release feeds.
concurrency:
  group: desktop-release-completion
  cancel-in-progress: false

jobs:
  complete:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run || github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_attempt || github.event.workflow_run.run_attempt }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LUMIVERSE_UPDATER_PUBLIC_KEY: ${{ vars.LUMIVERSE_UPDATER_PUBLIC_KEY || secrets.LUMIVERSE_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate original request and all required private build identities
        id: resolve
        env:
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
        run: bun scripts/private-linux-release.ts resolve
      - name: Download the successful private Linux build
        if: steps.resolve.outputs.ready == 'true' && steps.resolve.outputs.linux_ready == 'true'
        uses: actions/download-artifact@v7
        with:
          repository: prolix-oc/Lumiverse-Builds
          run-id: ${{ steps.resolve.outputs.linux_run }}
          name: ${{ steps.resolve.outputs.linux_artifact }}
          github-token: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          path: linux-artifacts
      - name: Download the successful private Windows build
        if: steps.resolve.outputs.ready == 'true' && steps.resolve.outputs.windows_ready == 'true'
        uses: actions/download-artifact@v7
        with:
          repository: prolix-oc/Lumiverse-Builds
          run-id: ${{ steps.resolve.outputs.windows_run }}
          name: ${{ steps.resolve.outputs.windows_artifact }}
          github-token: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          path: windows-artifacts
      - name: Download native Windows ARM64 runtime qualification
        if: steps.resolve.outputs.ready == 'true' && steps.resolve.outputs.windows_ready == 'true'
        uses: actions/download-artifact@v7
        with:
          repository: prolix-oc/Lumiverse-Builds
          run-id: ${{ steps.resolve.outputs.windows_run }}
          name: ${{ steps.resolve.outputs.windows_qualification }}
          github-token: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          path: windows-qualification
      - name: Download the successful private Intel macOS build
        if: steps.resolve.outputs.ready == 'true' && steps.resolve.outputs.macos_ready == 'true'
        uses: actions/download-artifact@v7
        with:
          repository: prolix-oc/Lumiverse-Builds
          run-id: ${{ steps.resolve.outputs.macos_run }}
          name: ${{ steps.resolve.outputs.macos_artifact }}
          github-token: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          path: macos-artifacts
      - name: Check out the exact release source
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.source }}
          path: source
          persist-credentials: false
      - name: Reuse the published Intel LanceDB dependency when available
        if: steps.resolve.outputs.ready == 'true' && steps.resolve.outputs.macos_ready == 'true'
        working-directory: source
        run: bun --no-env-file scripts/lancedb-macos-release.ts download --allow-missing
      - name: Verify checksums, source, version, architecture and runtime provenance
        if: steps.resolve.outputs.ready == 'true'
        env:
          PRIVATE_WINDOWS_RUN: ${{ steps.resolve.outputs.windows_run }}
          PRIVATE_WINDOWS_ATTEMPT: ${{ steps.resolve.outputs.windows_attempt }}
          PRIVATE_MACOS_RUN: ${{ steps.resolve.outputs.macos_run }}
          PRIVATE_MACOS_ATTEMPT: ${{ steps.resolve.outputs.macos_attempt }}
        run: bun scripts/private-linux-release.ts stage
      - name: Publish or reuse the verified Intel LanceDB dependency
        if: steps.resolve.outputs.ready == 'true' && steps.resolve.outputs.macos_ready == 'true'
        run: >-
          bun --no-env-file -e 'import {publishIntelLanceDb} from "./source/scripts/lancedb-macos-release.ts";
          import {ReleaseAPI} from "./source/scripts/desktop-release.ts";
          await publishIntelLanceDb(new ReleaseAPI("prolix-oc/Lumiverse",process.env.GITHUB_TOKEN),
          "source/dist/native/lancedb-darwin-x64",process.env.DESKTOP_SHA,
          "Native checks ran on the private Intel macOS builder.");'
      - name: Install signing CLI dependencies
        if: steps.resolve.outputs.ready == 'true'
        run: bun install --cwd source/desktop --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        if: steps.resolve.outputs.ready == 'true'
      - name: Sign, independently verify, and upload every returned platform
        if: steps.resolve.outputs.ready == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LINUX_READY: ${{ steps.resolve.outputs.linux_ready }}
          WINDOWS_READY: ${{ steps.resolve.outputs.windows_ready }}
          MACOS_READY: ${{ steps.resolve.outputs.macos_ready }}
        run: |
          set -euo pipefail
          targets=()
          if [[ "$LINUX_READY" == true ]]; then targets+=(x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu); fi
          if [[ "$WINDOWS_READY" == true ]]; then targets+=(x86_64-pc-windows-msvc aarch64-pc-windows-msvc); fi
          if [[ "$MACOS_READY" == true ]]; then targets+=(x86_64-apple-darwin); fi
          for target in "${targets[@]}"; do
            bundle="source/desktop/src-tauri/target/$target/release/bundle"
            case "$target" in
              x86_64-unknown-linux-gnu) platform=linux-x86_64; folder=appimage; pattern='*.AppImage' ;;
              aarch64-unknown-linux-gnu) platform=linux-aarch64; folder=appimage; pattern='*.AppImage' ;;
              x86_64-pc-windows-msvc) platform=windows-x86_64; folder=nsis; pattern='*-setup.exe' ;;
              aarch64-pc-windows-msvc) platform=windows-aarch64; folder=nsis; pattern='*-setup.exe' ;;
              x86_64-apple-darwin) platform=darwin-x86_64; folder=macos; pattern='*.app.tar.gz' ;;
              *) exit 1 ;;
            esac
            mapfile -d '' payloads < <(find "$bundle/$folder" -maxdepth 1 -type f -name "$pattern" -print0)
            test "${#payloads[@]}" = 1
            bun run --cwd source/desktop tauri signer sign "${GITHUB_WORKSPACE}/${payloads[0]}"
            cargo run --locked --release --manifest-path source/desktop/tools/verify-updater/Cargo.toml -- "$bundle"
            DESKTOP_PLATFORM="$platform" DESKTOP_TARGET="$target" bun source/scripts/publish-desktop-release.ts upload
          done
      - name: Advance the channel only after every platform succeeds
        id: publish
        if: steps.resolve.outputs.ready == 'true' || steps.resolve.outputs.published == 'true'
        env:
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
        run: bun scripts/private-linux-release.ts publish
      # Releases published with GITHUB_TOKEN do not trigger a release workflow.
      - name: Announce the published desktop nightly in Discord
        if: steps.publish.outputs.published_channel == 'nightly'
        continue-on-error: true
        env:
          DISCORD_NIGHTLY_WEBHOOK_URL: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.publish.outputs.published_tag }}
        run: bun --no-env-file scripts/notify-nightly-release.ts desktop "$RELEASE_TAG"
