name: Nightly Bundled Desktop Release

# The default branch's desktop-nightly-scheduler.yml owns the daily cron.
# Keep this workflow callable without adding a second schedule on promotion.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      version: ${{ steps.release.outputs.version }}
      fingerprint: ${{ steps.release.outputs.fingerprint }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Skip unchanged bundled source since the last successful nightly
        id: release
        env:
          DESKTOP_CHANNEL: nightly
        run: bun scripts/prepare-desktop-release.ts
  release:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/server-bundle.yml
    with:
      source: ${{ needs.prepare.outputs.sha }}
      channel: nightly
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      fingerprint: ${{ needs.prepare.outputs.fingerprint }}
    secrets: inherit
