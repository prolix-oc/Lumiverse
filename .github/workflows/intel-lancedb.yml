name: Intel LanceDB Native Dependency

on:
  workflow_dispatch:
    inputs:
      seed_cache_key:
        description: 'Optional existing validated cache to migrate; a miss fails without rebuilding'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: intel-lancedb-native-dependency
  cancel-in-progress: false

jobs:
  prepare:
    name: Reuse or queue the pinned Intel addon
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Test artifact validation and release recovery
        run: bun --no-env-file test tests/lancedb-macos-native.test.ts scripts/lancedb-macos-release.test.ts scripts/intel-lancedb-bridge.test.ts
      - name: Resolve the native build policy
        id: policy
        run: bun --no-env-file scripts/lancedb-macos-release.ts identity
      - name: Reuse an already published dependency
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun --no-env-file scripts/lancedb-macos-release.ts download --allow-missing
      - name: Restore a verified build before considering compilation
        if: steps.release.outputs.available != 'true'
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: dist/native/lancedb-darwin-x64
          key: ${{ inputs.seed_cache_key || steps.policy.outputs.cache_key }}
      - name: Require the selected migration cache
        if: inputs.seed_cache_key != '' && steps.release.outputs.available != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: bun -e 'throw new Error("Migration cache not found on this branch. Dispatch on its owning branch; no rebuild was started.")'
      - name: Retain the seed for native testing on the private runner
        if: steps.release.outputs.available != 'true' && steps.cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: intel-lancedb-seed-${{ github.run_attempt }}
          path: dist/native/lancedb-darwin-x64
          if-no-files-found: error
          retention-days: 1
      - name: Queue the private Intel macOS runner
        if: steps.release.outputs.available != 'true'
        env:
          LINUX_RELEASE_BRIDGE_TOKEN: ${{ secrets.LINUX_RELEASE_BRIDGE_TOKEN }}
          NATIVE_SEED: ${{ steps.cache.outputs.cache-hit == 'true' }}
        run: bun --no-env-file scripts/intel-lancedb-bridge.ts dispatch
