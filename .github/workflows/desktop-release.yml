name: Stable Bundled Desktop Release

# Stable updates are deliberate versioned releases from main. Server-only
# changes also require a desktop version bump because the server ships inside it.
on:
  push:
    tags: ['desktop-v*', '!desktop-v*-*']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      version: ${{ steps.release.outputs.version }}
      fingerprint: ${{ steps.release.outputs.fingerprint }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Require source already on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Prepare versioned stable release
        id: release
        env:
          DESKTOP_CHANNEL: stable
          DESKTOP_TAG_VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [ -n "$DESKTOP_TAG_VERSION" ]; then export DESKTOP_TAG_VERSION="${DESKTOP_TAG_VERSION#desktop-v}"; fi
          bun scripts/prepare-desktop-release.ts
  release:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/server-bundle.yml
    with:
      source: ${{ needs.prepare.outputs.sha }}
      channel: stable
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      fingerprint: ${{ needs.prepare.outputs.fingerprint }}
    secrets: inherit
