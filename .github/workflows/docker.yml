name: Build & Push Docker Image

on:
  push:
    tags: ["v*"]
    # GitHub does not evaluate `paths` filters for tag pushes, so release
    # builds are gated on a previous-tag diff in the job condition below
    # instead: tags that change nothing the image compiles, runs, or
    # documents skip the build. Weekly schedule and manual dispatch always
    # build and are not diff-gated.
  schedule:
    # Weekly rebuild to refresh the CA certificate bundle baked into `:latest`.
    # Combined with the CA_REFRESH build-arg below, this forces apt to pull the
    # current `ca-certificates` package so TLS trust stays in sync with Mozilla
    # root updates without waiting for a Lumiverse release.
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  changes:
    name: Check release diff
    # GitHub ignores `paths` filters on tag pushes, so this job compares the
    # tag against the previous tag and only builds when image-essential or
    # documentation paths changed. Schedule/dispatch runs skip this gate.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        run: |
          set -euo pipefail
          if git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^" >/dev/null 2>&1; then
            base=$(git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^")
            files=$(git diff --name-only "$base" "refs/tags/${GITHUB_REF_NAME}" -- src/ frontend/ user-docs/ developer-docs/ docs/ README.md CHANGELOG.md package.json bun.lock Dockerfile .dockerignore)
            if [ -n "$files" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # First release tag: no baseline, so build.
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    # Diff-gated for tag pushes (see the `changes` job). Fail-open: if the
    # gate job errors, build anyway so a release never silently loses its
    # image. Schedule/dispatch build unconditionally.
    if: >-
      always() && (
        github.event_name != 'push' ||
        needs.changes.result == 'failure' ||
        needs.changes.outputs.build == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The native Tauri app is not part of the container build.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/desktop/

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/prolix-oc/lumiverse
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}

      - name: Compute CA refresh key (ISO week)
        id: ca
        run: echo "refresh=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CA_REFRESH=${{ steps.ca.outputs.refresh }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
