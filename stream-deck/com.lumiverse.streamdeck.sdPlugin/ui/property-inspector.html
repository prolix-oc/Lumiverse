<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lumiverse</title>
  <style>
    body { font: 13px system-ui, sans-serif; color: #ddd; padding: 10px; }
    label { display: block; margin: 10px 0 4px; }
    input, select { box-sizing: border-box; width: 100%; padding: 6px; background: #333; color: #fff; border: 1px solid #555; }
    #status { margin-top: 10px; color: #aaa; }
  </style>
</head>
<body>
  <label for="server">Lumiverse URL</label><input id="server" placeholder="http://localhost:3000">
  <label for="token">Integration token</label><input id="token" type="password" placeholder="lvsd_…">
  <div id="characterFields" hidden><label for="character">Character</label><select id="character"><option value="">Choose a character…</option></select></div>
  <div id="status"></div>
  <script src="property-inspector.js"></script>
</body>
</html>
