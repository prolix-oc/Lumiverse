<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop authorization</title></head>
<body><main class="dialog">
  <h1>Authorize Lumiverse Desktop</h1>
  <p class="intro">This connects native desktop features. Signing in inside the integrated browser is a separate session.</p>
  <p id="origin"></p><p id="status" role="status" aria-live="polite">Preparing sign-in…</p>
  <p id="auth-error" class="error" role="alert" hidden></p>
  <section id="manual" hidden>
    <label for="authorization-url">If no browser appeared, copy this temporary link into your browser:</label>
    <textarea id="authorization-url" readonly rows="4" spellcheck="false"></textarea>
    <button id="copy" class="button button-secondary" type="button">Copy sign-in link</button>
    <p class="field-hint">Keep this link private. It expires after five minutes. Complete consent in that browser and return here.</p>
  </section>
  <footer class="actions"><button id="cancel" class="button button-secondary" type="button">Cancel</button><button id="retry" class="button button-primary" type="button">Retry</button></footer>
</main><script type="module" src="/src/authorization.ts"></script></body></html>
