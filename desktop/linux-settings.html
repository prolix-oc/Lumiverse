<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux graphics</title></head>
<body><main class="dialog">
  <h1>Linux graphics &amp; diagnostics</h1>
  <p class="intro">Changes apply after you quit and reopen Desktop. Explicit launch environment values take priority.</p>
  <form id="graphics-form">
    <p><label for="backend">Display backend</label><select id="backend"><option value="auto">Automatic</option><option value="wayland">Native Wayland</option><option value="x11">X11 / XWayland</option></select></p>
    <p><label for="mode">Rendering</label><select id="mode"><option value="default">Default accelerated path</option><option value="accelerated">Request acceleration (respect launch overrides)</option><option value="nvidia-sync">NVIDIA: disable explicit sync only</option><option value="dmabuf-off">Compatibility: disable DMABUF (may be slower)</option><option value="software">Last resort: disable accelerated compositing (slower)</option></select></p>
    <p><label><input id="opaque" type="checkbox"> Create opaque windows and disable native blur (diagnostic)</label></p>
    <p class="field-hint">On NVIDIA Wayland, test disabling explicit sync first. Compatibility modes can reduce performance. These settings do not certify hardware acceleration.</p>
    <button class="button button-primary" type="submit">Save for next launch</button>
  </form>
  <p id="status" role="status"></p>
  <p><button id="copy" class="button button-secondary" type="button">Copy diagnostics</button></p>
  <textarea id="report" readonly rows="9" aria-label="Redacted Linux diagnostics"></textarea>
</main><script type="module" src="/src/linux-settings.ts"></script></body></html>
