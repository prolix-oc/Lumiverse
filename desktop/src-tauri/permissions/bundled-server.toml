[[permission]]
identifier = "bundled-server-controls"
description = "Allows the local tray to own the included server process."
commands.allow = ["bundled_server_available", "bundled_server_start", "bundled_server_stop", "bundled_server_status", "bundled_server_alive", "bundled_server_network_access", "bundled_server_set_network_access"]

[[permission]]
identifier = "bundled-server-setup"
description = "Allows the local first-run window to configure its native server."
commands.allow = ["bundled_setup_defaults", "bundled_setup_save", "bundled_setup_status", "bundled_setup_complete", "bundled_setup_pick_folder"]

[[permission]]
identifier = "instance-connection-setup"
description = "Allows the local instance selector to detect the built-in server and choose an existing checkout."
commands.allow = ["bundled_server_available", "pick_folder", "validate_repo", "resolve_bun"]
