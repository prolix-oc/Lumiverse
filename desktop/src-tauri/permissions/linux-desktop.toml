[[permission]]
identifier = "external-url-launch"
description = "Open HTTP(S), mail, or telephone links with the host desktop's URL handler. Cannot open files or run executables."
commands.allow = ["open_external_url"]

[[permission]]
identifier = "desktop-artifact-reveal"
description = "Only the tray can reveal a locally built desktop artifact."
commands.allow = ["reveal_desktop_artifact"]

[[permission]]
identifier = "linux-desktop-controls"
description = "Local graphics settings and redacted diagnostics."
commands.allow = ["linux_diagnostics", "save_linux_graphics", "show_linux_settings"]

[[permission]]
identifier = "desktop-authorization-ui"
description = "Only the local authorization UI may read the short-lived sign-in URL and request retry or cancellation."
commands.allow = ["remote_authorization_status", "remote_authorization_cancel", "remote_authorization_retry"]

[[permission]]
identifier = "desktop-smoke"
description = "Report successful offline fixture interaction when the explicit smoke launch switch is enabled."
commands.allow = ["desktop_smoke_complete"]
