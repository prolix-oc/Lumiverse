[[permission]]
identifier = "tray-commands"
description = "Allows the hidden tray host to manage the Lumiverse runner and frontend window."
commands.allow = [
  "runner_start",
  "runner_send",
  "runner_alive",
  "runner_kill",
  "validate_repo",
  "discover_repo",
  "resolve_bun",
  "desktop_shell_sha",
  "take_desktop_update_resume",
  "desktop_startup_ready",
  "quit_app",
  "alert",
  "confirm",
  "pick_folder",
  "show_frontend",
  "close_frontend",
  "reload_frontend",
  "save_frontend_bounds",
  "frontend_visible",
  "frontend_exists",
  "show_frontend_url_settings",
  "show_extension_widget",
  "return_extension_widget_from_tray"
]

[[permission]]
identifier = "desktop-notification-registration"
description = "Allows the trusted Lumiverse frontend to enroll this desktop install for native notifications without exposing notification delivery itself."
commands.allow = [
  "desktop_notification_device",
  "desktop_notification_permission",
  "desktop_notification_transport_status",
  "save_desktop_notification_enrollment",
  "clear_desktop_notification_enrollment"
]

[[permission]]
identifier = "allow-configure-frontend-appearance"
description = "Allows the frontend WebView to configure its native translucent appearance."
commands.allow = ["configure_frontend_appearance"]

[[permission]]
identifier = "desktop-frontend-presence"
description = "Allows the frontend WebView to read whether its native window is visible, minimized, and frontmost."
commands.allow = ["frontend_presence"]

[[permission]]
identifier = "desktop-startup-appearance"
description = "Allows the frontend to cache a safe startup titlebar and native appearance snapshot."
commands.allow = ["cache_frontend_startup_appearance"]

[[permission]]
identifier = "desktop-sso-popup-close"
description = "Allows a Lumiverse sign-in popup to destroy only its own native window after completing authentication."
commands.allow = ["close_current_sso_popup"]

[[permission]]
identifier = "desktop-widget-catalog"
description = "Allows the Lumiverse frontend to publish its registered floating widgets to the desktop tray."
commands.allow = ["set_desktop_widget_catalog", "resize_extension_widget", "return_extension_widget"]

[[permission]]
identifier = "desktop-widget-size-sync"
description = "Allows a native floating widget window to synchronize only its own size."
commands.allow = ["sync_desktop_widget_size"]

[[permission]]
identifier = "remote-instance-commands"
description = "Allows only the local tray host to authorize, poll, and disconnect a selected remote Lumiverse instance."
commands.allow = [
  "remote_instance_connect",
  "remote_instance_poll",
  "remote_instance_disconnect"
]

[[permission]]
identifier = "desktop-update-install"
description = "Allows only the hidden local tray host to stage a validated desktop installer handoff."
commands.allow = ["stage_desktop_update"]
